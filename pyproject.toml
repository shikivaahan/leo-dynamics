[build-system]
# The build backend and the pybind11 headers are pinned exactly, so a wheel
# build resolves the same packaging logic and the same binding headers on every
# host. CMake and Ninja are lower bounds, not pins: any conforming release from
# those versions up works, and the isolated build environment installs one when
# the host has none.
# Eigen and Boost are deliberately not listed here: they are header-only C++
# dependencies, and cmake/provision.cmake downloads pinned, SHA-256-verified
# archives during configure (LEO_PROVISION_DEPENDENCIES), so no host headers and
# no host package manager are involved.
requires = [
  "scikit-build-core==0.11.6",
  "pybind11==3.1.0",
  "cmake>=3.28",
  "ninja>=1.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "leo-dynamics"
version = "0.1.0"
description = "Native LEO orbital dynamics: two-body, J2 and environmental propagation with a NumPy interface"
readme = { file = "README.dist.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "leo-dynamics contributors" }]
keywords = [
  "astrodynamics",
  "orbit-propagation",
  "leo",
  "j2",
  "solar-radiation-pressure",
  "simulations",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
# NumPy is the only mandatory runtime dependency: it is the array interface to
# the native engine, which itself links nothing beyond the C++ runtime. The floor
# is the NumPy 2.x series the interface was qualified against.
dependencies = ["numpy>=2.0"]
# The MIT core of this distribution - the numerical engine, its public headers,
# the Python interface, the build machinery and the public overview - is
# licensed under the MIT License. The licence grant is scoped to that core
# only: LICENSE_SCOPE.md enumerates it and release-audit/license-boundary.json
# holds the machine-readable form. Everything else in the repository (the
# empirical atmosphere providers, the research campaigns and their datasets,
# the optimisation experiments, the frozen research reference fixtures, the
# project documentation set and the release tooling) is proprietary and is not
# distributed with either distribution.
license = "MIT"
license-files = ["LICENSE", "LICENSE_SCOPE.md", "THIRD_PARTY_NOTICES.md"]

[project.urls]
Homepage = "https://github.com/shikivaahan/leo-dynamics"
Repository = "https://github.com/shikivaahan/leo-dynamics"
Issues = "https://github.com/shikivaahan/leo-dynamics/issues"
# The Python guide is the canonical reference for installation, development
# builds and the deferred atmospheric models. It is not a changelog, so it is
# published under its real name.
Documentation = "https://github.com/shikivaahan/leo-dynamics/blob/main/docs/python-development.md"

[tool.scikit-build]
cmake.version = ">=3.28"
cmake.build-type = "Release"
# Release symbols are not shipped; the install step strips the extension.
install.strip = true
# python/leo_dynamics is the only importable package: __init__.py, __init__.pyi
# and py.typed ship from here, and CMake installs _core beside them.
wheel.packages = ["python/leo_dynamics"]

[tool.scikit-build.cmake.define]
LEO_BUILD_PYTHON_BINDINGS = "ON"
LEO_BUILD_INTEGRATION = "ON"
LEO_BUILD_ANALYSIS = "ON"
LEO_BUILD_EXAMPLES = "OFF"
BUILD_TESTING = "OFF"
# Pinned Eigen 3.4.0 and Boost 1.83.0 archives, SHA-256 verified at configure.
LEO_PROVISION_DEPENDENCIES = "ON"
# Stated explicitly so a reader of the built metadata sees the intent: the
# standard distribution carries no SPICE kernels and no NRLMSISE-00 or JB2008
# sources. A caller who overrides these through config-settings is building
# something else on purpose and must provision those dependencies themselves.
LEO_ENABLE_CSPICE = "OFF"
LEO_ENABLE_NRLMSISE00 = "OFF"
LEO_ENABLE_JB2008 = "OFF"
LEO_TEST_PLOTTING = "OFF"

[tool.scikit-build.sdist]
# The source distribution carries the MIT core and nothing else. The core is
# enumerated explicitly below, and every proprietary area is excluded
# explicitly as well, so an unclassified or newly added path cannot slip into
# the archive: `ci/verify_license_boundary.py` checks the built archive
# member by member against release-audit/license-boundary.json and fails
# closed on anything unexpected.
#
# What is deliberately NOT here: the empirical atmosphere providers
# (src/atmosphere, include/leo/atmosphere, the provider cmake files), the
# CSPICE adapter (src/environment/spice.cpp), the research campaigns and their
# datasets (docs/atmosphere, docs/multithreading, docs/numerical-audit), the
# optimisation experiments (benchmarks, scripts), the frozen research
# reference fixtures and every test suite (tests), the project documentation
# set (docs), the examples and plotting helpers, and the packaging, CI and
# release tooling (ci, .github).
include = [
  "/LICENSE",
  "/LICENSE_SCOPE.md",
  "/THIRD_PARTY_NOTICES.md",
  "/README.dist.md",
  "/CMakeLists.txt",
  "/pyproject.toml",
  "/cmake/provision.cmake",
  "/bindings/*.cpp",
  "/bindings/*.hpp",
  "/python/leo_dynamics/*.py",
  "/python/leo_dynamics/*.pyi",
  "/python/leo_dynamics/py.typed",
  "/src/kernel/*.cpp",
  "/src/integration/*.cpp",
  "/src/analysis/*.cpp",
  "/include/leo/kernel/*.hpp",
  "/include/leo/integration/*.hpp",
  "/include/leo/integration/detail/*.hpp",
  "/include/leo/analysis/*.hpp",
  "/include/leo/environment/ephemeris.hpp",
  "/include/leo/environment/interpolated.hpp",
  "/include/leo/environment/source.hpp",
]
exclude = [
  # Repository plumbing: not part of the distribution.
  "/.gitattributes",
  "/.gitignore",
  "/build*/**",
  # Local wheel/sdist output directories, including repaired wheels.
  "/dist*/**",
  "/.github/**",
  "/.venv-python/**",
  "/outputs/**",
  "/.pytest_cache/**",
  "**/__pycache__/**",
  "**/*.pyc",
  # Proprietary: high-fidelity atmosphere providers and their build files.
  "/src/atmosphere/**",
  "/include/leo/atmosphere/**",
  "/cmake/nrlmsise00.cmake",
  "/cmake/nrlmsise00-tests.cmake",
  "/cmake/jb2008.cmake",
  # Proprietary: the CSPICE adapter.
  "/src/environment/**",
  "/include/leo/environment/spice.hpp",
  # Proprietary: research campaigns, datasets and the project documentation set.
  "/docs/**",
  "/benchmarks/**",
  "/scripts/**",
  # Proprietary: the research reference fixtures and every test suite.
  "/tests/**",
  "/examples/**",
  "/plotting/**",
  # Proprietary: packaging, CI and release tooling, and the audit records.
  "/ci/**",
  "/release-audit/**",
  "/audit-evidence/**",
  "/PROPRIETARY-NOTICE.md",
  "/RELEASE_LICENSE_AUDIT.md",
  "/audit-progress.md",
  "/README.md",
]