name: Release (TestPyPI only)

# TestPyPI publication for the first public release. This workflow uploads to
# https://test.pypi.org/legacy/ and to nothing else: there is no production
# PyPI job here, and the production pending publisher on pypi.org is left
# untouched.
#
# The trigger is manual and deliberate. There is no `push`, `pull_request`,
# `release` or schedule trigger, so no pull-request code and no fork code can
# reach the publishing job. The release job additionally refuses to run from
# any ref other than the default branch, so the artefacts are always built
# from the reviewed default-branch tree.
#
# Publication uses GitHub OIDC Trusted Publishing through the official PyPA
# action. There is no API token, no password and no long-lived secret in this
# repository.
#
# Nothing is uploaded until every gate has passed on this exact commit:
# the licence gate, the native validation, the wheel matrix with its
# installed-wheel parity check, the source-distribution rebuild, and the
# artefact verification.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match pyproject.toml)"
        required: true
        type: string

# Default to no permissions for every job; each job opts into exactly what it
# needs. Only the publishing job holds id-token: write.
permissions: {}

concurrency:
  # The `release-testpypi-` prefix keeps this group distinct from every other
  # workflow's group. Inside a reusable workflow `github.workflow` is the
  # *caller's* workflow name, so the wheels workflow called from here would
  # otherwise compute the same group as this one and cancel it. A release is
  # never cancelled and never cancels ordinary CI.
  group: release-testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The licence gate. Nothing is built and no OIDC token is requested until the
  # copyright holder has granted redistribution rights for the project's own
  # code and the metadata says so. Today this job fails: the repository has no
  # LICENSE file. That failure is the intended behaviour, not a defect.
  preflight:
    name: Licence, version and branch gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # A manual trigger is not in itself a guarantee that the released tree is
      # the reviewed one: the dispatch can select any branch or tag. This
      # refuses everything that is not the default branch.
      - name: Refuse a ref that is not the default branch
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "release refused: '$RELEASE_REF' is not the default branch 'refs/heads/$DEFAULT_BRANCH'" >&2
            exit 1
          fi
      - name: Check out the released commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify the licence and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python3 ci/release_preflight.py
          --project-root .
          --expected-version "$RELEASE_VERSION"

  # The native validation, at exactly the commit being released: the C++ suite,
  # the sanitiser build and the frozen independent references. This is the
  # same workflow ordinary CI runs, called rather than duplicated.
  native-validation:
    name: Native validation and sanitizers
    needs: preflight
    # A same-repository reusable workflow, referenced without a ref, so the
    # called workflow is taken from the same commit as this one.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The wheel matrix, the installed-wheel parity check and the source
  # distribution rebuild, at exactly the commit being released. This is the
  # same workflow ordinary CI runs, called rather than duplicated.
  wheel-validation:
    name: Wheels, installed-wheel parity and sdist rebuild
    needs: preflight
    # A same-repository reusable workflow, referenced without a ref, so the
    # called workflow is taken from the same commit as this one.
    uses: ./.github/workflows/wheels.yml
    permissions:
      contents: read

  # The six-hour numerical qualification and comparative campaign, at exactly
  # the commit being released. This is the same workflow a manual qualification
  # run uses, called rather than duplicated.
  qualification:
    name: Six-hour qualification campaign
    needs: preflight
    # A same-repository reusable workflow, referenced without a ref, so the
    # called workflow is taken from the same commit as this one.
    uses: ./.github/workflows/qualification.yml
    permissions:
      contents: read

  # Collect the artefacts the wheel workflow produced, verify that every one of
  # them is the artefact this commit was supposed to produce, and package them
  # as a single uploadable set. This job holds read-only permissions: it
  # cannot publish.
  collect:
    name: Verify and collect the release artefacts
    needs: [preflight, wheel-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the released commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the packaging tools
        run: python -m pip install --upgrade pip packaging build twine
      - name: Download the built artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "wheels-*"
          path: artifacts
      - name: Download the source distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist
          path: artifacts/sdist
      # The wheel matrix job records which commit each artefact was built
      # from. This step refuses to proceed if any artefact does not match the
      # commit being released.
      - name: Verify the artefacts against the released commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: >-
          python3 ci/verify_release_artifacts.py
          --artifacts artifacts
          --expected-commit "${{ github.sha }}"
          --expected-run-id "${{ github.run_id }}"
          --expected-version "$RELEASE_VERSION"
      - name: Refuse proprietary or unexpected distribution members
        run: >-
          python3 ci/verify_license_boundary.py
          --project-root .
          --artifacts artifacts
      - name: Check the distribution metadata
        run: >-
          python -m twine check
          artifacts/*/*.whl
          artifacts/sdist/*.tar.gz
      - name: Collect the distributions to upload
        run: |
          mkdir -p dist
          find artifacts -name '*.whl' -exec cp {} dist/ \;
          find artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          ls -l dist/
      - name: Upload the verified distribution set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  # The publishing job. It runs in the `testpypi` environment, holds only
  # id-token: write, checks out nothing, and uploads to TestPyPI only.
  publish:
    name: Publish to TestPyPI
    needs: [collect, native-validation, qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: testpypi
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Download the verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      - name: List what will be uploaded
        run: ls -l dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # TestPyPI does not allow a filename to be reused, so a failed
          # attempt must be retried under a new version rather than silently
          # skipped.
          skip-existing: false
          verbose: true
