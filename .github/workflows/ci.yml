name: Stage 1 analytical validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            cc: gcc
            cxx: g++
            build_type: Release
            cxx_flags: ""
            linker_flags: ""
          - name: Clang Release
            cc: clang
            cxx: clang++
            build_type: Release
            cxx_flags: ""
            linker_flags: ""
          - name: Clang ASan UBSan
            cc: clang
            cxx: clang++
            build_type: Debug
            cxx_flags: -fsanitize=address,undefined -fno-omit-frame-pointer
            linker_flags: -fsanitize=address,undefined
    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang libeigen3-dev libboost-dev git
      - name: Bootstrap Catch2 v3.7.1 outside project configure
        run: |
          git clone --depth 1 --branch v3.7.1 https://github.com/catchorg/Catch2.git "$RUNNER_TEMP/Catch2"
          cmake -S "$RUNNER_TEMP/Catch2" -B "$RUNNER_TEMP/catch-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCATCH_BUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/catch-install"
          cmake --build "$RUNNER_TEMP/catch-build" --parallel
          cmake --install "$RUNNER_TEMP/catch-build"
      - name: Build and validate full propagation
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" -DBUILD_TESTING=ON -DLEO_BUILD_EXAMPLES=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/catch-install" -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          ./build/propagate_leo --model point-mass
          ./build/propagate_leo --model j2
      - name: Build and validate kernel only
        run: |
          cmake -S . -B build-kernel -G Ninja -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" -DLEO_BUILD_INTEGRATION=OFF -DBUILD_TESTING=ON -DLEO_BUILD_EXAMPLES=OFF -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/catch-install" -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"
          cmake --build build-kernel --parallel
          ctest --test-dir build-kernel --output-on-failure
