name: Analytical numerical-audit plotting and cache validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            cc: gcc
            cxx: g++
            build_type: Release
            cxx_flags: ""
            linker_flags: ""
          - name: Clang Release
            cc: clang
            cxx: clang++
            build_type: Release
            cxx_flags: ""
            linker_flags: ""
          - name: Clang ASan UBSan
            cc: clang
            cxx: clang++
            build_type: Debug
            cxx_flags: -fsanitize=address,undefined -fno-omit-frame-pointer
            linker_flags: -fsanitize=address,undefined
    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang libeigen3-dev libboost-dev git curl ncompress python3-venv
      - name: Bootstrap Catch2 v3.7.1 outside project configure
        run: |
          git clone --depth 1 --branch v3.7.1 https://github.com/catchorg/Catch2.git "$RUNNER_TEMP/Catch2"
          cmake -S "$RUNNER_TEMP/Catch2" -B "$RUNNER_TEMP/catch-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCATCH_BUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/catch-install"
          cmake --build "$RUNNER_TEMP/catch-build" --parallel
          cmake --install "$RUNNER_TEMP/catch-build"
      - name: Install optional plotting dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/plot-venv"
          "$RUNNER_TEMP/plot-venv/bin/python" -m pip install -r plotting/requirements.txt
          echo "$RUNNER_TEMP/plot-venv/bin" >> "$GITHUB_PATH"
      - name: Bootstrap CSPICE N0067 and real Sun smoke kernels
        run: |
          curl --fail --location https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Linux_GCC_64bit/packages/cspice.tar.Z -o "$RUNNER_TEMP/cspice.tar.Z"
          tar -xZf "$RUNNER_TEMP/cspice.tar.Z" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/spice-kernels"
          curl --fail --location https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de432s.bsp -o "$RUNNER_TEMP/spice-kernels/de432s.bsp"
          curl --fail --location https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls -o "$RUNNER_TEMP/spice-kernels/naif0012.tls"
      - name: Build and validate full propagation
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" -DBUILD_TESTING=ON -DLEO_BUILD_EXAMPLES=ON -DLEO_TEST_PLOTTING=ON -DLEO_ENABLE_CSPICE=ON -DCSPICE_ROOT="$RUNNER_TEMP/cspice" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/catch-install" -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"
          cmake --build build --parallel
          LEO_SPICE_TEST_SPK="$RUNNER_TEMP/spice-kernels/de432s.bsp" LEO_SPICE_TEST_LSK="$RUNNER_TEMP/spice-kernels/naif0012.tls" ctest --test-dir build --output-on-failure
          # Fast independent numerical regressions are also part of the full
          # matrix above; keep a focused command discoverable in CI output.
          ctest --test-dir build --output-on-failure -R "Conical disk overlap|small centre separations|Apparent body radius|Sentman small lift|self-adjoint inertia|Rejected large adaptive|Projected adaptive"
          ./build/propagate_leo --model point-mass
          ./build/propagate_leo --model j2
          ./build/propagate_environment "$RUNNER_TEMP/spice-kernels/naif0012.tls" "$RUNNER_TEMP/spice-kernels/de432s.bsp" 0
          ./build/analyze_orbit "$RUNNER_TEMP/analysis-deterministic"
          python3 plotting/plot_analysis.py "$RUNNER_TEMP/analysis-deterministic" --output "$RUNNER_TEMP/analysis-deterministic/plots" --format both
          ./build/analyze_orbit "$RUNNER_TEMP/analysis-spice" --spice "$RUNNER_TEMP/spice-kernels/naif0012.tls" "$RUNNER_TEMP/spice-kernels/de432s.bsp" 0
          python3 plotting/plot_analysis.py "$RUNNER_TEMP/analysis-spice" --output "$RUNNER_TEMP/analysis-spice/plots"
      - name: Validate frozen independent v0.1 references
        run: |
          # Consume committed data only: no reference regeneration and no
          # mandatory SciPy/Tudat dependency in the production C++ build.
          cmake -S tests/reference -B build-reference -G Ninja -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"
          cmake --build build-reference --parallel
          ctest --test-dir build-reference --output-on-failure -L reference
      - name: Validate optional direct NRLMSISE reference
        run: |
          python3 docs/atmosphere/acquire.py --destination "$RUNNER_TEMP/atmosphere-reference" --groups nrlmsise00 --acknowledge-external-terms
          cmake -S . -B build-atmosphere-reference -G Ninja -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" -DBUILD_TESTING=ON -DLEO_ENABLE_CSPICE=ON -DLEO_ENABLE_NRLMSISE00=ON -DLEO_ENABLE_JB2008=OFF -DLEO_NRLMSISE00_ROOT="$RUNNER_TEMP/atmosphere-reference" -DLEO_NRLMSISE00_REFERENCE_DOCUMENTATION="$RUNNER_TEMP/atmosphere-reference/NRLMSISE-DOCUMENTATION" -DCSPICE_ROOT="$RUNNER_TEMP/cspice" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/catch-install" -DCMAKE_C_FLAGS="${{ matrix.cxx_flags }}" -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"
          cmake --build build-atmosphere-reference --parallel
          LEO_SPICE_TEST_SPK="$RUNNER_TEMP/spice-kernels/de432s.bsp" LEO_SPICE_TEST_LSK="$RUNNER_TEMP/spice-kernels/naif0012.tls" ctest --test-dir build-atmosphere-reference --output-on-failure
          # JB2008 uses externally acquired assets with unclear redistribution
          # terms; official fixture validation is optional local evidence.
      - name: Exercise optional cache against direct SPICE on a short arc
        if: matrix.name == 'GCC Release'
        run: |
          cmake -S benchmarks/cases -B build-bench -DCMAKE_BUILD_TYPE=Release -DLEO_ENABLE_CSPICE=ON -DCSPICE_ROOT="$RUNNER_TEMP/cspice"
          cmake --build build-bench --parallel
          python3 - <<'PY'
          import json, math, os, subprocess
          kernels = os.environ["RUNNER_TEMP"] + "/spice-kernels/"
          outputs = {}
          for mode in ("direct", "cached"):
              outputs[mode] = json.loads(subprocess.check_output([
                  "./build-bench/leo_bench", "--case", "BENCH-03", "--mode", mode,
                  "--duration", "60", "--interval", "900",
                  "--spk", kernels + "de432s.bsp", "--lsk", kernels + "naif0012.tls"]))
          direct, cached = (outputs[m]["reference"] for m in ("direct", "cached"))
          for key, limit in (("final_position_m", 1e-2), ("final_velocity_m_s", 1e-5),
                             ("final_quaternion", 5e-7), ("final_omega_rad_s", 1e-8)):
              error = math.sqrt(sum((a-b)**2 for a,b in zip(direct[key], cached[key])))
              assert error <= limit, (key, error)
          assert abs(direct["cumulative_srp_work_j"] - cached["cumulative_srp_work_j"]) <= 1e-5
          print("Direct/cached short-arc numerical smoke passed; not six-hour acceptance.")
          PY
      - name: Build and validate kernel only
        run: |
          cmake -S . -B build-kernel -G Ninja -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" -DLEO_BUILD_INTEGRATION=OFF -DLEO_BUILD_ANALYSIS=OFF -DBUILD_TESTING=ON -DLEO_BUILD_EXAMPLES=OFF -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/catch-install" -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linker_flags }}"
          cmake --build build-kernel --parallel
          ctest --test-dir build-kernel --output-on-failure
