# CASE-A v1 - analytical compact 6U-class free-flyer, NOT verified flight specifications.
# All models fixed: J2, conical SRP+torque, Sentman drag, albedo, gravity-gradient.
# Epoch ET=0. Optical/Cd/accommodation values are explicit exploratory assumptions.
version 1
id CASE-A
mass_kg 10.0
# Diagonal inertia, uniform bus plus -1 mm centre-of-mass offset along body y:
# Ix = m(b^2+c^2)/12 - m*1e-6, Iy = m(a^2+c^2)/12, Iz = m(a^2+b^2)/12 - m*1e-6
inertia_kg_m2 0.10832333333333334 0.08333333333333333 0.041656666666666675
orbit_m_rad 7178137.0 0.001 0.9005898940290741 0.0 0.0 0.0
attitude_in_plane_deg 45.0
omega_body_rad_s 0.02 0.0 0.0
pointing_axis_body 1.0 0.0 0.0
density_scale 1.0
# surface area nx ny nz cx cy cz specular diffuse Cd accommodation
# +x and -x: 0.2 x 0.3 m bus faces
surface 0.06 1.0 0.0 0.0 0.05 0.001 0.0 0.3 0.2 2.2 0.9
surface 0.06 -1.0 0.0 0.0 -0.05 0.001 0.0 0.3 0.2 2.2 0.9
# +y and -y: 0.1 x 0.3 m
surface 0.03 0.0 1.0 0.0 0.0 0.101 0.0 0.3 0.2 2.2 0.9
surface 0.03 0.0 -1.0 0.0 0.0 -0.099 0.0 0.3 0.2 2.2 0.9
# +z and -z: 0.1 x 0.2 m
surface 0.02 0.0 0.0 1.0 0.0 0.001 0.15 0.3 0.2 2.2 0.9
surface 0.02 0.0 0.0 -1.0 0.0 0.001 -0.15 0.3 0.2 2.2 0.9